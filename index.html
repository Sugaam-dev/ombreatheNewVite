<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/images/omBreatheLogo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/hero-mobile.webp" as="image" type="image/webp" fetchpriority="high" media="(max-width: 768px)" />
    <link rel="preload" href="/hero-desktop.webp" as="image" type="image/webp" fetchpriority="high" media="(min-width: 769px)" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>

    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Ombreathe - Your journey to inner peace and wellness through yoga"
    />

    <title>Ombreathe</title>

    <!-- Google Tag Manager (Interaction-based Loading for 95+ Performance) -->
    <script>
      (function() {
        var gtmLoaded = false;
        function loadGTM() {
          if (gtmLoaded) return;
          gtmLoaded = true;
          
          window.removeEventListener('scroll', loadGTM);
          window.removeEventListener('touchstart', loadGTM);
          window.removeEventListener('keydown', loadGTM);

          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({
              "gtm.start": new Date().getTime(),
              event: "gtm.js",
            });

            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";

            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", "GTM-TLBQP5FL");
        }

        window.addEventListener('scroll', loadGTM, { passive: true });
        window.addEventListener('touchstart', loadGTM, { passive: true });
        window.addEventListener('keydown', loadGTM, { passive: true });

        // Fallback: load GTM after 8 seconds if no interaction
        setTimeout(loadGTM, 8000);
      })();
    </script>
    <style>
      /* Critical Above-the-fold Styles for 100/100 performance */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        background-color: #fbf9f4;
      }
      .slider-container {
        position: relative;
        width: 100%;
        height: calc(100vh - 96px);
        overflow: hidden;
        background: #000;
      }
      .slider-image-wrapper {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .slider-image-wrapper.active {
        opacity: 1;
        z-index: 2;
      }
      .slider-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        display: block;
      }
      .slider-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 3;
      }
    </style>
  </head>

  <body style="padding-top: 0px;">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TLBQP5FL"
        height="0"
        width="0"
        style="display:none;visibility:hidden"
      ></iframe>
    </noscript>

    <div id="root">
      <!-- Critical Layout Skeleton for Fast 0.2s FCP Paint -->
      <div style="height: 96px; background-color: #fbf9f4;"></div>
      <div class="slider-container">
        <div class="slider-overlay"></div>
      </div>
    </div>

    <!-- Vite Entry -->
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
